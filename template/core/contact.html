{% include 'core/header.html' %}
<style>
  .star-rating .star-btn {
    cursor: pointer;
    transition: transform 0.2s;
  }

  .star-rating .star-btn:hover {
    transform: scale(1.2);
  }

  .star-rating .fas {
    color: #ffc107;
  }
</style>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

<div class="container py-5">
  <h2 class="text-center fw-bold mb-4">Contact Us</h2>

  {% if messages %} {% for message in messages %}
  <script>
    alert('{{ message|escapejs }}');
  </script>
  {% endfor %} {% endif %}

  <div class="text-center mb-4" data-aos="zoom-in">
    <lottie-player
      src="https://assets2.lottiefiles.com/packages/lf20_jcikwtux.json"
      background="transparent"
      speed="1"
      style="width: 200px; height: 200px; margin: auto"
      loop
      autoplay>
    </lottie-player>
  </div>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <div class="row">
    <div class="col-md-6">
      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" name="name" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea
            class="form-control"
            rows="4"
            name="message"
            required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Rate Our Service</label>
          <div class="star-rating fs-3 text-warning">
            <i class="far fa-star star-btn" data-value="1"></i>
            <i class="far fa-star star-btn" data-value="2"></i>
            <i class="far fa-star star-btn" data-value="3"></i>
            <i class="far fa-star star-btn" data-value="4"></i>
            <i class="far fa-star star-btn" data-value="5"></i>
          </div>
          <input type="hidden" name="rating" id="rating-value" value="0" />
        </div>

        <script>
          document.addEventListener('DOMContentLoaded', function () {
            const stars = document.querySelectorAll('.star-btn');
            const ratingInput = document.getElementById('rating-value');

            stars.forEach((star) => {
              star.addEventListener('click', function () {
                const val = this.getAttribute('data-value');
                ratingInput.value = val;

                // Update stars appearance
                stars.forEach((s, index) => {
                  if (index < val) {
                    s.classList.remove('far');
                    s.classList.add('fas');
                  } else {
                    s.classList.remove('fas');
                    s.classList.add('far');
                  }
                });
              });
            });
          });
        </script>

        <button class="btn btn-warning fw-bold">Send Message</button>
      </form>
    </div>

    <div class="col-md-6">
      <h5 class="fw-bold">Address</h5>
      <p>Finolex Academy, Ratnagiri - 415612</p>

      <h6>Email</h6>
      <p>nestxteam2025@gmail.com</p>

      <h6>Phone</h6>
      <p>+91 9822165231</p>

      <iframe
        class="w-100 mt-2"
        height="220"
        style="border-radius: 10px; border: 0"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3837.1336619524817!2d73.32872587458907!3d17.00868528496898!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcfd1fd9a51efc7%3A0x21decb50483f79a2!2sFinolex%20Academy%20of%20Management%20and%20Technology!5e0!3m2!1sen!2sin!4v1706534903387!5m2!1sen!2sin"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>
</div>

{% include 'core/footer.html' %}
