{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart PG/Hostel System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" />
    <link rel="manifest" href="{% static 'media/site.webmanifest' %}" />

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  </head>

  <body
    style="font-family: cursive; background-color: #f8f9fa; padding-top: 80px">
    <nav
      class="navbar fixed-top navbar-expand-lg"
      style="
        background-color: white;
        border-bottom: 1px solid rgb(176, 170, 170);
      ">
      <div class="container">
        <a
          class="navbar-brand font-monospace d-flex align-items-center"
          href="{% url 'owner:owner_dashboard' %}">
          <img
            src="media/logo/Smart Logo 123.png"
            width="60px"
            height="40px"
            alt="Logo Icon" />
          <img
            src="media/logo/roommate logo.png"
            width="200px"
            height="30px"
            class="ms-2"
            alt="RoomMate Text" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse text-capitalize"
          id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0" style="font-size: 20px">
            <!-- <li class="nav-item me-3">
              <a class="nav-link" href="{% url 'owner:add_pg' %}"
                >Add Property</a
              >
            </li> -->
            <li class="nav-item me-3">
              <a class="nav-link" href="{% url 'core:about' %}">About</a>
            </li>
            <li class="nav-item me-3">
              <a class="nav-link" href="{% url 'core:contact' %}">Contact</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle" style="font-size: 20px"></i>
                {% if user.is_authenticated %}
                {{ user.first_name|default:user.username }}
                {% else %}
                Account
                {% endif %}
              </a>
              <ul class="dropdown-menu dropdown-menu-end" style="z-index: 1050">
                <li>
                  <a class="dropdown-item" href="{% url 'user:user_account' %}"
                    >Your Account</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  {% if user.is_authenticated %}
                  <a
                    class="dropdown-item text-danger"
                    href="{% url 'user:user_logout' %}">
                    <i
                      class="bi bi-box-arrow-right"
                      style="font-size: 20px"></i>
                    Logout
                  </a>
                  {% else %}
                  <a class="dropdown-item" href="{% url 'user:user_login' %}">
                    <i
                      class="bi bi-box-arrow-in-right"
                      style="font-size: 20px"></i>
                    Login
                  </a>
                  {% endif %}
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
