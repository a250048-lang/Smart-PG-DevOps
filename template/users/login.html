{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="manifest" href="{% static 'media/site.webmanifest' %}" />
  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh; /* Allows scrolling on small screens */
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f2f5; /* Added a subtle bg color to see the card better */
      padding: 20px; /* Prevents card from touching edges on mobile */
    }

    .container {
      position: relative;
      max-width: 430px; /* Standard desktop width */
      width: 100%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); /* Softened shadow slightly */
      overflow: hidden;
      margin: 0;
    }

    /* Sliding form structure preserved */
    .container .forms {
      display: flex;
      align-items: center;
      height: 100%;
      width: 200%;
      transition: height 0.2s ease;
    }

    .container .form {
      width: 50%;
      padding: 30px;
      background-color: #fff;
      transition: margin-left 0.18s ease;
    }

    /* Typography */
    .container .form .title {
      position: relative;
      font-size: 27px;
      font-weight: 600;
      color: #333;
    }

    .form .title::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 30px;
      background-color: rgb(16, 80, 255);
      border-radius: 25px;
    }

    /* Inputs */
    .form .input-field {
      position: relative;
      height: 50px;
      width: 100%;
      margin-top: 30px; /* Increased spacing slightly */
    }

    .input-field input {
      position: absolute;
      height: 100%;
      width: 100%;
      padding: 0 35px;
      border: none;
      outline: none;
      font-size: 16px;
      border-bottom: 2px solid #ccc;
      border-top: 2px solid transparent;
      transition: all 0.2s ease;
      background: transparent;
    }

    .input-field input::placeholder {
      color: #999;
    }

    .input-field input:is(:focus, :valid) {
      border-bottom-color: #333;
    }

    .input-field i {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 23px;
      transition: all 0.2s ease;
      left: 0;
    }

    .input-field input:is(:focus, :valid) ~ i {
      color: #333;
    }

    /* Checkbox & Links */
    .form .checkbox-text {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    .checkbox-content {
      display: flex;
      align-items: center;
    }

    .checkbox-content input {
      margin-right: 10px;
      accent-color: #4070f4;
    }

    .form .text {
      color: #333;
      font-size: 14px;
    }

    .form a.text {
      color: #4070f4;
      text-decoration: none;
    }

    /* Buttons */
    .form .button {
      margin-top: 35px;
    }

    .form .button .input {
      border: none;
      color: #fff;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 1px;
      border-radius: 6px;
      background-color: #4070f4;
      cursor: pointer;
      padding: 12px; /* Increased padding for better touch target */
      width: 100%;
      transition: all 0.3s ease;
    }

    .button input:hover {
      background-color: #265df2;
    }

    /* --- RESPONSIVENESS --- */

    /* On mobile phones (width less than 500px) */
    @media (max-width: 500px) {
      .container {
        max-width: 100%; /* Use full width */
      }
      .container .form {
        padding: 20px; /* Reduce padding to save space */
      }
    }
  </style>

  <body>
    {% if messages %}
    <ul class="list-unstyled d-none">
      {% for message in messages %}
      <li class="django-message" data-message="{{ message }}">{{ message }}</li>
      <script defer>
        alert('{{message}}');
      </script>
      {% endfor %}
    </ul>
    {% endif %}

    <div class="container">
      <div class="forms">
        <div class="form login">
          <span class="title">Login</span>

          <form method="POST">
            {% csrf_token %}

            <div class="input-field">
              <input
                type="text"
                placeholder="Enter Username"
                name="username"
                id="email"
                required />
              <i class="bi bi-person-circle"></i>
            </div>

            <div class="input-field">
              <input
                type="password"
                placeholder="Enter Password"
                name="password"
                id="psw"
                required />
              <i class="bi bi-person-fill-lock"></i>
            </div>

            <div class="checkbox-text">
              <div class="checkbox-content">
                <input type="checkbox" id="logCheck" onclick="myFunction()" />
                <label for="logCheck" class="text">Show Password</label>
              </div>
            </div>

            <div class="input-field button">
              <button type="submit" id="login-btn" class="input">
                Login Now
              </button>
            </div>

            <p class="text-center mt-3">
              <a
                href="{% url 'user:password_reset' %}"
                style="text-decoration: none; color: #4070f4">
                Forgot Password?
              </a>
            </p>

            <p class="text-center mt-2 text">
              Don't have an account?
              <a
                href="{% url 'user:user_register' %}"
                style="text-decoration: none; color: #4070f4">
                Register
              </a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script>
      function myFunction() {
        var x = document.getElementById('psw');
        if (x.type === 'password') {
          x.type = 'text';
        } else {
          x.type = 'password';
        }
      }
    </script>
  </body>
</html>
